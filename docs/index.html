<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>生日快乐 🎂</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #fdf6f9;
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
      overflow-x: hidden;
    }
    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 40px 30px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      position: relative;
      animation: fadeIn 1.2s ease forwards;
      opacity: 0;
    }
    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
      from { opacity: 0; transform: translateY(30px); }
    }
    h1 {
      font-size: 32px;
      color: #ff5e84;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 18px;
      color: #666;
      margin-bottom: 20px;
    }
    .message {
      font-size: 16px;
      line-height: 1.8;
      color: #444;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #ff5e84;
      color: white;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      background: #e64a70;
      transform: scale(1.05);
    }
    .balloon {
      position: absolute;
      width: 40px;
      height: 50px;
      background: #ff9bbb;
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
      opacity: 0.8;
    }
    .balloon::before {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 20px;
      background: #888;
    }
@keyframes float {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-25px) rotate(2deg); }
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: linear-gradient(135deg, #fff, #fff5f7);
      padding: 40px;
      border-radius: 24px;
      text-align: center;
      max-width: 320px;
      box-shadow: 0 20px 60px rgba(255,94,132,0.3);
      animation: popIn 0.4s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-icon {
      font-size: 50px;
      margin-bottom: 15px;
      animation: bounce 1s infinite;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .modal h2 {
      color: #ff5e84;
      font-size: 26px;
      margin-bottom: 15px;
    }
    .modal p {
      color: #666;
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 25px;
    }
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
<div class="card">
    <img src="image.png" alt="图片" style="width: 130px; height: 100px; object-fit: cover; margin-bottom: 10px;">
    <img src="image.jpg" alt="图片" style="width: 130px; height: 100px; object-fit: cover; margin-bottom: 10px;">
    <h1>🎂 祝Harrison</h1>
    <p class="subtitle">愿你岁岁常欢愉，万事皆胜意</p>
    <div class="message">
      这是一份用AI(爱)写的赛博礼物<br>
      愿你新的一岁：<br>
      平安喜乐，闪闪发光，永远被爱包围，永远年轻 ✨
    </div>
<button class="btn" onclick="wish()">点击接收祝福</button>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-icon">🎉</div>
      <h2>老大！</h2>
      <p>祝你天天开心<br>所愿皆成真<br>永远年轻，永远热泪盈眶 ✨</p>
      <button class="btn" onclick="closeModal()">谢谢~</button>
    </div>
  </div>

<script>
    function wish() {
      document.getElementById('modal').classList.add('show')
      createConfetti()
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('show')
    }
    function createConfetti() {
      const colors = ['#ff5e84', '#ff9bbb', '#ffd700', '#87ceeb', '#98fb98']
      for (let i = 0; i < 30; i++) {
        const confetti = document.createElement('div')
        confetti.className = 'confetti'
        confetti.style.left = Math.random() * 100 + 'vw'
        confetti.style.top = '-10px'
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)]
        confetti.style.animation = (2 + Math.random() * 2) + 's linear'
        document.body.appendChild(confetti)
        setTimeout(()=>{confetti.remove()}, 4000)
      }
    }

    // 随机飘气球
    function createBalloon() {
      const body = document.body
      const balloon = document.createElement('div')
      balloon.classList.add('balloon')
      balloon.style.left = Math.random() * 100 + 'vw'
      balloon.style.background = `hsl(${Math.random()*360}, 80%, 70%)`
      balloon.style.animationDuration = (4 + Math.random()*6) + 's'
      body.appendChild(balloon)
      setTimeout(()=>{balloon.remove()}, 10000)
    }
    setInterval(createBalloon, 1200)
  </script>
</body>
</html>
